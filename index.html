<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111111"><meta name="description" content="양정원 바보 글자를 누르고 흔들고 날려보는 장난 놀이터"><title>양정원 바보</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23111'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-size='40' fill='%23f8ec55'%3E%E3%85%82%3C/text%3E%3C/svg%3E"><style>
:root{font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#111;background:#f3f1eb}*{box-sizing:border-box}body{margin:0;overflow:hidden}button{font:inherit;cursor:pointer}main{min-height:100svh;display:flex;flex-direction:column}.top{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,42px);font-size:13px;font-weight:800;letter-spacing:.06em}.top span:last-child{opacity:.48}.play{position:relative;flex:1;min-height:180px;display:grid;place-items:center;overflow:hidden;touch-action:manipulation}.play:before{content:'';position:absolute;width:min(68vmin,520px);aspect-ratio:1;border:1px solid #dedbd1;border-radius:50%;pointer-events:none}.play:after{content:'';position:absolute;width:min(42vmin,340px);aspect-ratio:1;border:1px dashed #e0ddd4;border-radius:50%;pointer-events:none}.title{z-index:2;display:flex;justify-content:center;align-items:center;gap:.035em;white-space:nowrap;font-size:clamp(39px,10.5vw,116px);font-weight:1000;letter-spacing:-.09em;line-height:1.35;filter:drop-shadow(0 8px 0 #e5e1d7);user-select:none;touch-action:none;will-change:transform}.char{display:inline-block;cursor:pointer;transform-origin:50% 75%;transition:color .15s}.space{width:.28em}.char:hover{color:#ec4d31}.char.bop{animation:bop .42s cubic-bezier(.2,1.7,.3,1) both}.title.jump{animation:jump .65s cubic-bezier(.2,1,.25,1)}.title.shake{animation:shake .6s}.title.spin{animation:spin .8s cubic-bezier(.2,.8,.25,1)}.title.squash{animation:squash .7s}.title.flip{animation:flip .8s}.title.quake{animation:quake .7s}.char.boom{animation:boom 1.25s cubic-bezier(.16,.8,.24,1) both}.char.rain{position:fixed;z-index:5;pointer-events:none;animation:fall 1.8s linear forwards}.clone{position:absolute;font-weight:900;font-size:clamp(16px,4vw,28px);color:#ec4d31;pointer-events:none;animation:clone .9s ease-out both}.toast{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:#111;color:white;padding:9px 17px;border-radius:50px;font-size:14px;font-weight:800;z-index:12;white-space:nowrap}.hint{position:absolute;bottom:20px;z-index:1;font-size:13px;font-weight:700;color:#77746c}.panel{position:relative;z-index:10;width:min(620px,100% - 24px);margin:0 auto max(12px,env(safe-area-inset-bottom));background:#171717;color:white;border-radius:26px;padding:15px;box-shadow:0 15px 35px #17171730}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:2px 5px 13px;font-weight:900;font-size:14px}.count{color:#aaa;font-size:12px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.action{border:1px solid #343434;background:#292929;color:white;border-radius:14px;min-height:48px;font-size:15px;font-weight:800;transition:transform .1s,background .15s}.action:active{transform:scale(.95);background:#484848}.action:hover{background:#383838}.footer{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.footer .action:first-child{background:#f4e955;color:#111;border-color:#f4e955}.footer .action:last-child{background:#343434}.extra{display:none;margin-top:8px}.extra.open{display:grid}.status{position:absolute;top:17px;left:50%;transform:translateX(-50%);font-size:14px;font-weight:800;color:#77746c;white-space:nowrap}.title.flee{position:absolute;transition:left .25s,top .25s,transform .25s;font-size:clamp(30px,8vw,90px)}@keyframes bop{50%{transform:translateY(-.13em) scale(1.65);color:#ec4d31}}@keyframes jump{50%{transform:translateY(-1em) rotate(-3deg)}}@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-22px) rotate(-4deg)}40%,80%{transform:translateX(22px) rotate(4deg)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes squash{40%{transform:scale(1.28,.45)}70%{transform:scale(.85,1.3)}}@keyframes flip{50%{transform:rotateY(180deg)}to{transform:rotateY(360deg)}}@keyframes quake{10%,30%,50%,70%{transform:translate(-13px,9px) rotate(-3deg)}20%,40%,60%,80%{transform:translate(13px,-9px) rotate(3deg)}}@keyframes boom{0%{transform:scale(1);opacity:1}12%{transform:scale(1.7);color:#ff4b31}50%{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1.25);opacity:.15}75%{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(.6);opacity:.5}100%{transform:none;opacity:1}}.burst{position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(circle,#fff 0%,#ffe85a 14%,#ff5b36 27%,transparent 62%);animation:burst .55s ease-out forwards}.spark{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;background:#f04d32;z-index:4;pointer-events:none;animation:spark .9s ease-out forwards}@keyframes burst{0%{opacity:0;transform:scale(.1)}20%{opacity:.9}100%{opacity:0;transform:scale(2)}}@keyframes spark{to{opacity:0;transform:translate(var(--sx),var(--sy)) scale(.2)}}.title.game .char{border-radius:15px;padding:.04em;background:#fff;border:2px solid #111;margin:0 .015em;filter:none}.title.game .space{display:none}.title.game .char.done{background:#f4e955;color:#111}.title.game .char.flash{background:#ec4d31;color:#fff;transform:translateY(-.2em) scale(1.12)}@keyframes fall{to{transform:translateY(110vh) rotate(680deg);opacity:0}}@keyframes clone{0%{transform:translateY(12px) scale(.4);opacity:0}30%{opacity:1}100%{transform:translateY(-58px) rotate(-12deg);opacity:0}}@media(max-width:600px){.top{height:48px}.panel{width:calc(100% - 16px);margin-bottom:max(8px,env(safe-area-inset-bottom));border-radius:22px;padding:11px}.panel-head{padding-bottom:10px}.action{min-height:43px;font-size:14px;border-radius:12px}.grid{gap:6px}.footer{gap:6px;margin-top:6px}.hint{bottom:11px;font-size:12px}.play:before{width:83vmin}.play:after{width:53vmin}}@media(max-height:680px){.top{height:38px}.panel{padding:9px}.panel-head{padding-bottom:6px}.action{min-height:38px}.hint{display:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><main><header class="top"><span>양정원 바보</span><span>TOUCH & PLAY · 01</span></header><section class="play" id="play" aria-label="글자 놀이터"><div class="status" id="status" aria-live="polite"></div><div class="title" id="title" aria-label="양정원 바보"><span class="char">양</span><span class="char">정</span><span class="char">원</span><span class="space"></span><span class="char">바</span><span class="char">보</span></div><div class="hint">글자를 직접 눌러봐!</div></section><section class="panel" aria-label="장난 컨트롤 패널"><div class="panel-head"><span>✳</span><span class="count" id="count">0번</span></div><div class="grid"><button class="action" data-effect="jump">↑ 점프</button><button class="action" data-effect="wave">〰 웨이브</button><button class="action" data-effect="shake">↔ 흔들기</button><button class="action" data-effect="spin">⟳ 회전</button><button class="action" data-effect="boom">✳ 폭발</button><button class="action" data-effect="copy">⧉ 복제</button></div><div class="grid extra" id="extra"><button class="action" data-effect="squash">▰ 납작</button><button class="action" data-effect="flip">⇄ 뒤집기</button><button class="action" data-effect="flee">↗ 술래잡기</button><button class="action" data-effect="order">① 순서 맞히기</button><button class="action" data-effect="rain">☂ 글자비</button><button class="action" data-effect="memory">◉ 기억하기</button><button class="action" data-effect="reset">↺ 초기화</button><button class="action" data-effect="auto">▶ 자동재생</button></div><div class="footer"><button class="action" data-effect="random">🎲 랜덤</button><button class="action" id="more" aria-expanded="false" aria-controls="extra">＋ 더보기</button></div></section></main><script>
const title=document.querySelector('#title'),play=document.querySelector('#play'),chars=[...document.querySelectorAll('.char')],status=document.querySelector('#status'),count=document.querySelector('#count'),extra=document.querySelector('#extra'),more=document.querySelector('#more');
let n=0,auto=null,flee=0,toastTimer,game=null,gameTimers=[];
const randomItems=['jump','wave','shake','spin','boom','copy','squash','flip','rain'];
function note(s,ms=1800){status.textContent=s;clearTimeout(toastTimer);toastTimer=setTimeout(()=>status.textContent='',ms)}
function replay(el,klass,duration=900){el.classList.remove(klass);void el.offsetWidth;el.classList.add(klass);setTimeout(()=>el.classList.remove(klass),duration)}
function wave(){chars.forEach((c,i)=>setTimeout(()=>replay(c,'bop',450),i*115))}
function clearGame(){gameTimers.forEach(clearTimeout);gameTimers=[];game=null;title.classList.remove('game');chars.forEach(c=>{c.classList.remove('done','flash');c.style.order=''})}
function reset(){clearInterval(auto);auto=null;clearGame();flee=0;title.className='title';title.style.cssText='';document.querySelectorAll('.clone,.rain,.burst,.spark').forEach(e=>e.remove());note('다시 처음으로!')}
function move(){const maxX=Math.max(0,play.clientWidth-title.offsetWidth-12),maxY=Math.max(0,play.clientHeight-title.offsetHeight-14);title.style.left=(6+Math.random()*maxX)+'px';title.style.top=(7+Math.random()*maxY)+'px'}
function startGame(kind){clearGame();title.classList.remove('flee');title.style.cssText='';title.classList.add('game');const indices=[0,1,2,3,4];if(kind==='order'){const shuffled=[...indices].sort(()=>Math.random()-.5);if(shuffled.every((v,i)=>v===i))shuffled.reverse();shuffled.forEach((v,i)=>chars[v].style.order=i);game={kind,step:0};note('양 → 정 → 원 → 바 → 보 순서로!',3500)}else{const sequence=Array.from({length:4},()=>Math.floor(Math.random()*5));game={kind,step:0,sequence,ready:false};note('빛나는 글자 4개를 기억해!',4300);sequence.forEach((v,i)=>{gameTimers.push(setTimeout(()=>chars[v].classList.add('flash'),550+i*850));gameTimers.push(setTimeout(()=>chars[v].classList.remove('flash'),1120+i*850))});gameTimers.push(setTimeout(()=>{if(game?.kind==='memory'){game.ready=true;note('기억한 순서대로 터치!',5000)}},3900))}}
function hitGame(i){if(!game)return false;if(game.kind==='order'){if(i===game.step){chars[i].classList.add('done');game.step++;if(game.step===5){clearGame();note('성공! 순서대로 잡았다 🎉',3000)}else note(`${game.step}/5`,1200)}else{note('다시 처음부터!');game.step=0;chars.forEach(c=>c.classList.remove('done'))}}else if(game.ready){if(i===game.sequence[game.step]){game.step++;note(`${game.step}/4`,1200);if(game.step===4){clearGame();note('기억력 성공! 🎉',3000)}}else{note('아깝다! 다시 보여줄게');startGame('memory')}}return true}
function explosion(){const rect=play.getBoundingClientRect(),radius=Math.min(rect.width,rect.height)*.48;let flash=document.createElement('div');flash.className='burst';play.append(flash);setTimeout(()=>flash.remove(),600);chars.forEach((c,i)=>{let angle=i*2*Math.PI/5-Math.PI/2,dist=radius*(.8+Math.random()*.4);c.style.setProperty('--x',Math.cos(angle)*dist+'px');c.style.setProperty('--y',Math.sin(angle)*dist+'px');c.style.setProperty('--r',(i%2?1:-1)*(220+Math.random()*240)+'deg');replay(c,'boom',1300)});for(let i=0;i<22;i++){let e=document.createElement('i');e.className='spark';let angle=Math.random()*Math.PI*2,dist=50+Math.random()*radius;e.style.setProperty('--sx',Math.cos(angle)*dist+'px');e.style.setProperty('--sy',Math.sin(angle)*dist+'px');e.style.background=['#ff5b36','#f4e955','#111'][i%3];play.append(e);setTimeout(()=>e.remove(),950)}}
function effect(name){if(name==='random')name=randomItems[Math.floor(Math.random()*randomItems.length)];if(name==='reset'){reset();n=0;count.textContent='0번';return}if(name!=='auto'&&game)clearGame();n++;count.textContent=n+'번';switch(name){case 'wave':wave();break;case 'jump':case 'shake':case 'spin':case 'squash':case 'flip':replay(title,name);break;case 'boom':explosion();break;case 'copy':{let e=document.createElement('div');e.className='clone';e.textContent='양정원 바보';e.style.left=(10+Math.random()*65)+'%';e.style.top=(15+Math.random()*65)+'%';play.append(e);setTimeout(()=>e.remove(),950);break}case 'flee':title.classList.add('flee');move();flee=0;note('글자를 다섯 번 잡아봐!');break;case 'order':case 'memory':startGame(name);break;case 'rain':for(let i=0;i<18;i++)setTimeout(()=>{let e=document.createElement('span');e.className='char rain';e.textContent='양정원바보'[Math.floor(Math.random()*5)];e.style.left=Math.random()*100+'vw';e.style.top='-70px';e.style.fontSize=(20+Math.random()*35)+'px';e.style.color=['#ec4d31','#222','#e6c500'][i%3];document.body.append(e);setTimeout(()=>e.remove(),1900)},i*65);break;case 'auto':if(auto){clearInterval(auto);auto=null;note('자동재생 정지')}else{auto=setInterval(()=>effect(randomItems[Math.floor(Math.random()*randomItems.length)]),1200);note('자동재생 중 · 다시 누르면 정지')}break}}
document.querySelectorAll('[data-effect]').forEach(b=>b.addEventListener('click',()=>effect(b.dataset.effect)));
more.addEventListener('click',()=>{let open=extra.classList.toggle('open');more.setAttribute('aria-expanded',open);more.textContent=open?'－ 접기':'＋ 더보기'});
chars.forEach((c,i)=>c.addEventListener('click',()=>{if(hitGame(i))return;replay(c,'bop',450);if(title.classList.contains('flee')){if(++flee>=5){note('잡았다!');title.classList.remove('flee');title.style.cssText='';flee=0}else{note(`${flee}/5 잡았어!`);move()}}else{n++;count.textContent=n+'번'}}));
title.addEventListener('click',e=>{if(e.target===title)wave()});document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();effect('jump')}if(e.key.toLowerCase()==='r')effect('random')});
</script></body></html>
